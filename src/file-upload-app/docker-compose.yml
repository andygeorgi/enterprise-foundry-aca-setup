version: '3.8'

services:
  file-upload-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: file-upload-app
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - UPLOAD_FOLDER=/app/uploads
      - MAX_CONTENT_LENGTH=16777216  # 16MB in bytes
      - HEALTH_PORT=8081
    volumes:
      # Mount local uploads directory for persistence during development
      - ./uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
